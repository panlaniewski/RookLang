{% extends 'layout/basic.html' %}

{% block title %}Добавить карточку{% endblock %}

{% block content %}
<h1>Добавить карточку</h1>
<form method="post">
    {% csrf_token %}
    <div class="form-group">
        {{ form.word.label_tag }}
        {{ form.word }}
    </div>
    <div class="form-group">
        {{ form.translate.label_tag }}
        {{ form.translate }}
    </div>
    <input type="submit" value="Добавить">
</form>
{% endblock %}
